<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/css/style.css">
    <script defer src="/javascript/script.js"></script>
</head>
<body>
     
    <!-- hier komt de header -->
    
    <header id="header-plaats">
        <div class="head">
            <img class="flag" src="/img/flagland.png" alt="afbeelding" width="200" height="125px">
            <div class="titel">
                <h1>Ons website voor een goede doel</h1>
                <h3>Timer tot volgende event</h3>
                <div id="timers"></div>
                <div>
                    <div>
                        <button class="mobtn" onclick="lightmode()">light mode</button>
                        <button class="mobtn" onclick="darkmode()">dark mode</button>
                    </div>
                </div>
            </div>
            <div class="mode">
                <img id="moon" src="/img/dark.png" alt="afbeelding" width="125px" height="125px">
                <img id="sun" src="/img/lig.png" alt="afbeelding" width="100px" height="100px">
            </div>
        </div>
    </header>

</body>
</html>
